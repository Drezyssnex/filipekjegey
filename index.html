<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>🤡</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    cursor:crosshair;
}

.msg{
    position:absolute;
    font-size:40px;
    font-weight:bold;
    pointer-events:none;
    text-shadow:3px 3px 10px black;
    animation:spin 2s linear infinite;
}

img{
    position:absolute;
    width:180px;
    user-select:none;
    animation:bounce 1s infinite alternate;
}

@keyframes bounce{
    from{transform:scale(1) rotate(-15deg);}
    to{transform:scale(1.15) rotate(15deg);}
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<script>

const image="https://img.sanishtech.com/u/db9a28418f7ca933dac1c34cbdc65c60.jpg";

const texts=[
"SI BOT",
"NEUMÍŠ APEX",
"SMRDÍ TI NOHY",
"VLASY MÁŠ JAK KVĚTÁK",
"L + RATIO",
"404 SKILL NOT FOUND",
"TOHLE JSI NEČEKAL",
"NOOB ALERT",
"GG EZ",
"😂😂😂"
];

function rand(max){
    return Math.random()*max;
}

function randomColor(){
    return `hsl(${Math.random()*360},100%,50%)`;
}

function spawnImage(){

    const img=document.createElement("img");

    img.src=image;

    img.style.left=rand(window.innerWidth-200)+"px";
    img.style.top=rand(window.innerHeight-220)+"px";

    document.body.appendChild(img);

}

function spawnText(){

    const d=document.createElement("div");

    d.className="msg";

    d.innerText=texts[Math.floor(Math.random()*texts.length)];

    d.style.left=rand(window.innerWidth-300)+"px";
    d.style.top=rand(window.innerHeight-100)+"px";

    d.style.color=randomColor();

    document.body.appendChild(d);

    setTimeout(()=>d.remove(),2500);

}

setInterval(spawnImage,250);

setInterval(spawnText,180);

document.onclick=()=>{

    for(let i=0;i<25;i++){
        spawnImage();
    }

};

</script>

</body>
</html>
